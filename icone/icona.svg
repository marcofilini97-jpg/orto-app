<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- Icona dell'app Orto: zappa e cesto di ortaggi sul prato.
       Il disegno importante sta nel cerchio centrale (80%), così Android può ritagliarla -->
  <defs>
    <pattern id="prato" width="40" height="40" patternUnits="userSpaceOnUse">
      <rect width="40" height="40" fill="#7fa653"/>
      <circle cx="10" cy="10" r="4" fill="#6e9446"/><circle cx="30" cy="30" r="4" fill="#6e9446"/>
    </pattern>
  </defs>
  <rect width="512" height="512" fill="url(#prato)"/>
  <ellipse cx="256" cy="402" rx="160" ry="20" fill="#4f6e33" opacity="0.55"/>
  <!-- zappa appoggiata dietro il cesto -->
  <path d="M175 112 L380 398" stroke="#4a2e15" stroke-width="30" stroke-linecap="round"/>
  <path d="M175 112 L380 398" stroke="#a8743f" stroke-width="18" stroke-linecap="round"/>
  <path d="M182 128 L360 376" stroke="#d29a5e" stroke-width="5" stroke-linecap="round"/>
  <path d="M168 92 L102 104 L96 164 L150 154 Z" fill="#9aa4a8" stroke="#2b1d12" stroke-width="7" stroke-linejoin="round"/>
  <path d="M112 116 L108 148" stroke="#d6dde0" stroke-width="6" stroke-linecap="round"/>
  <!-- manico del cesto -->
  <path d="M164 292 C164 168 348 168 348 292" fill="none" stroke="#5c3d22" stroke-width="24" stroke-linecap="round"/>
  <path d="M164 292 C164 168 348 168 348 292" fill="none" stroke="#b37a40" stroke-width="13" stroke-linecap="round"/>
  <!-- ortaggi nel cesto -->
  <svg x="132" y="176" width="150" height="150" viewBox="0 0 60 60" stroke="#2B1D12" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round">
    <path d="M11 41 C8 31 16 24 21 28 C21 19 30 16 32 23 C36 16 47 20 43 29 C51 29 52 40 46 43 Z" fill="#6FAE3A"/>
    <path d="M17 41 C15 33 21 29 25 32 C25 26 33 24 34 29 C38 25 45 29 42 34 C46 36 45 41 42 42 Z" fill="#8CC94F"/>
    <path d="M23 41 C22 35 27 32 30 34 C33 31 38 34 37 41 Z" fill="#C2E383"/>
  </svg>
  <g transform="rotate(-62 330 250)">
    <svg x="240" y="175" width="170" height="170" viewBox="0 0 60 60" stroke="#2B1D12" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round">
      <path d="M15 37 C10 31 7 27 4 23 C9 25 13 30 15 37 Z" fill="#5FA83C"/><path d="M15 37 C11 29 10 24 10 18 C13 23 15 29 15 37 Z" fill="#6FBF45"/><path d="M15 38 C9 36 6 35 2 34 C7 33 12 34 15 38 Z" fill="#5FA83C"/>
      <path d="M14 38 C14 34 18 32.5 21 33 L48 40 C51 41 51 43 48 43.5 L21 46 C17 46.5 14 42.5 14 38 Z" fill="#EE7F2D"/>
      <path d="M20 35.2 Q28 36.2 36 38.2" fill="none" stroke="#FFB070" stroke-width="1.4"/>
    </svg>
  </g>
  <svg x="198" y="160" width="130" height="130" viewBox="0 0 60 60" stroke="#2B1D12" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round">
    <ellipse cx="30" cy="34" rx="15" ry="13" fill="#DB3F2E"/>
    <circle cx="22.5" cy="28" r="3" fill="#F28B7A" stroke="none"/>
    <path d="M30 19 L32.3 22.3 L36.5 21.6 L34 24.6 L30 23 L26 24.6 L23.5 21.6 L27.7 22.3 Z" fill="#4E8F32"/>
  </svg>
  <!-- cesto -->
  <path d="M142 292 L370 292 L344 402 L168 402 Z" fill="#c8894a" stroke="#5c3d22" stroke-width="9" stroke-linejoin="round"/>
  <path d="M152 326 H360 M160 360 H352" stroke="#8a5a2e" stroke-width="7" stroke-linecap="round"/>
  <path d="M200 300 L206 396 M256 300 V396 M312 300 L306 396" stroke="#a86e38" stroke-width="6" stroke-linecap="round"/>
  <rect x="130" y="274" width="252" height="30" rx="15" fill="#b37a40" stroke="#5c3d22" stroke-width="9"/>
  <path d="M150 284 H300" stroke="#e2b77a" stroke-width="6" stroke-linecap="round"/>
</svg>
