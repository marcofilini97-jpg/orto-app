<!doctype html>
<!-- Pagina di servizio per creare i PNG delle icone con Edge, es.:
     msedge --headless --hide-scrollbars --window-size=512,512 --screenshot=icona-512.png genera-png.html#icona.svg
     Edge non scende sotto una certa larghezza: per icona-192.png si crea la piccola a 512 e poi la si rimpicciolisce -->


<html>
<head>
<meta charset="utf-8">
<style>html, body { margin: 0; overflow: hidden; } img { display: block; width: 100vw; height: 100vh; }</style>
</head>
<body>
<img id="icona" alt="">
<script>document.getElementById('icona').src = location.hash.slice(1);</script>
</body>
</html>
